[workflow]

activation_steps_prepend = [
  "Before gathering review context, run `git status --porcelain`. If there are uncommitted changes, tell the user this review works best against a clean baseline and ask whether to commit the outstanding work now with a descriptive commit message before the review begins — this keeps any patches this review applies as a separately-diffable commit from the implementation that preceded them. If the user declines, or there's nothing uncommitted, proceed to Step 1 as normal.",
]

persistent_facts = [
  "STANDING PROCESS RULE (project-context.md Process Agreements, added after Story 3.4's code review, repeated after Story 3.6's): a code review that applies `patch` findings to a `.swift` file this project's own Simulator/Xcode cannot build or render (see project-context.md's devcontainer-limitations note) must NOT set the story's status to `done` in Step 4 Section 6, even if every decision-needed/patch finding was resolved. This applies with extra force when the patched file/behavior is one the story's own Completion Notes record as already manually Xcode/Simulator-verified (e.g. Task 4-style verification) — that verification covered the pre-patch code, not the patched code. In that situation, set `{new_status}` = `review` (not `done`), and explicitly ask the user to re-verify the *specific patched behavior* in Xcode/Simulator before advancing status further. Only move to `done` after the user confirms that re-verification. This overrides step-04-present.md's default 'all findings resolved -> done' status rule whenever it applies — treat it as a hard gate, not a suggestion to weigh against other signals.",
]
